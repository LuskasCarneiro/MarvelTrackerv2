name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    # Private shelves are enforced by Row Level Security and by nothing else, so the
    # policies get a real Postgres to be tested against on every push. A service container
    # is enough: the policies are plain Postgres and do not need the rest of the Supabase
    # stack. See supabase/tests/harness.sql for what is mirrored and why.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test RLS policies
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run test:rls

      - name: Build
        run: npm run build

      # The 3D shelf cannot be tested any other way. vitest does not run a browser, so it
      # cannot see a scene that renders nothing, a click that opens the wrong title, or a
      # module that throws before the canvas mounts — all three of which happened while it
      # was being built, and none of which failed a unit test at the time.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      # Placeholder values, because they are placeholders: the two NEXT_PUBLIC vars are public
      # by design and the shelf never calls Supabase. They are here because the client throws
      # at module load on an empty URL, which takes the whole page down — including routes
      # that have nothing to do with auth. That is exactly how this first failed in a fresh
      # worktree, and it looked like a WebGL bug for ten minutes.
      - name: Shelf smoke test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_ci
        run: npx playwright test e2e/shelf.spec.ts
